events {
    worker_connections 1024;
}

http {
    # Add map directive at the top of the http block
    map $ssl_server_name $ssl_certificate_main {
        bluesim.logtools.cloud /etc/letsencrypt/live/bluesim.logtools.cloud/fullchain.pem;
        default /etc/nginx/ssl/nginx-selfsigned.crt;
    }

    map $ssl_server_name $ssl_certificate_key_main {
        bluesim.logtools.cloud /etc/letsencrypt/live/bluesim.logtools.cloud/privkey.pem;
        default /etc/nginx/ssl/nginx-selfsigned.key;
    }

    map $ssl_server_name $ssl_certificate_blueos1 {
        bluesim1.logtools.cloud /etc/letsencrypt/live/bluesim1.logtools.cloud/fullchain.pem;
        default /etc/nginx/ssl/nginx-selfsigned.crt;
    }

    map $ssl_server_name $ssl_certificate_key_blueos1 {
        bluesim1.logtools.cloud /etc/letsencrypt/live/bluesim1.logtools.cloud/privkey.pem;
        default /etc/nginx/ssl/nginx-selfsigned.key;
    }

    map $ssl_server_name $ssl_certificate_blueos2 {
        bluesim2.logtools.cloud /etc/letsencrypt/live/bluesim2.logtools.cloud/fullchain.pem;
        default /etc/nginx/ssl/nginx-selfsigned.crt;
    }

    map $ssl_server_name $ssl_certificate_key_blueos2 {
        bluesim2.logtools.cloud /etc/letsencrypt/live/bluesim2.logtools.cloud/privkey.pem;
        default /etc/nginx/ssl/nginx-selfsigned.key;
    }

    upstream blueos1 {
        server blueos1:80;
    }

    upstream blueos2 {
        server blueos2:80;
    }

    upstream bluesim_ws {
        server godot_server:7000;
    }

    # Static files server
    server {
        listen 80;
        server_name bluesim.localhost bluesim.logtools.cloud;

        # Let's Encrypt certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name bluesim.localhost bluesim.logtools.cloud;

        ssl_certificate $ssl_certificate_main;
        ssl_certificate_key $ssl_certificate_key_main;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /deploy/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /bluesim_ws/ {
            proxy_pass http://bluesim_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }

    # First BlueOS instance
    server {
        listen 80;
        server_name bluesim1.localhost bluesim1.logtools.cloud;

        # Let's Encrypt certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name bluesim1.localhost bluesim1.logtools.cloud;

        ssl_certificate $ssl_certificate_blueos1;
        ssl_certificate_key $ssl_certificate_key_blueos1;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_hide_header Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://blueos1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # Second BlueOS instance
    server {
        listen 80;
        server_name bluesim2.localhost bluesim2.logtools.cloud;

        # Let's Encrypt certificate validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name bluesim2.localhost bluesim2.logtools.cloud;

        ssl_certificate $ssl_certificate_blueos2;
        ssl_certificate_key $ssl_certificate_key_blueos2;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_hide_header Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://blueos2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}